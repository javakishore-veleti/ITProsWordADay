AWSTemplateFormatVersion: "2010-09-09"
Description: IT Pros WordADay — ECS Fargate infrastructure (self-contained VPC)

Parameters:
  ContainerPort:
    Type: Number
    Default: 8080
  DesiredCount:
    Type: Number
    Default: 0
    Description: Set to 0 initially; deploy job sets to 1 after pushing image
  VpcCidr:
    Type: String
    Default: "10.1.0.0/16"
  PublicSubnet1Cidr:
    Type: String
    Default: "10.1.0.0/20"
  PublicSubnet2Cidr:
    Type: String
    Default: "10.1.16.0/20"

Resources:
  # ════════════════════════════════════════════════
  #  NETWORKING
  # ════════════════════════════════════════════════
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: itpros-wordaday-ecs-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: itpros-ecs-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: itpros-ecs-public-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway
  PublicSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ════════════════════════════════════════════════
  #  LOGGING
  # ════════════════════════════════════════════════
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/itpros-wordaday
      RetentionInDays: 30

  # ════════════════════════════════════════════════
  #  ECR
  # ════════════════════════════════════════════════
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: itpros-wordaday
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true

  # ════════════════════════════════════════════════
  #  ECS CLUSTER
  # ════════════════════════════════════════════════
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: itpros-wordaday-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ════════════════════════════════════════════════
  #  SECURITY GROUPS
  # ════════════════════════════════════════════════
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - allow HTTP/HTTPS from internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks - allow traffic from ALB only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  # ════════════════════════════════════════════════
  #  ALB
  # ════════════════════════════════════════════════
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: itpros-wordaday-alb
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: itpros-wordaday-tg
      TargetType: ip
      Port: !Ref ContainerPort
      Protocol: HTTP
      VpcId: !Ref Vpc
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ════════════════════════════════════════════════
  #  IAM
  # ════════════════════════════════════════════════
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: itpros-wordaday-ecs-exec-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ════════════════════════════════════════════════
  #  ECS TASK DEFINITION
  # ════════════════════════════════════════════════
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: itpros-wordaday-task
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: itpros-wordaday
          Image: !Sub "${EcrRepository.RepositoryUri}:latest"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: DEPLOYMENT_MODE
              Value: aws
            - Name: PORT
              Value: !Sub "${ContainerPort}"
            - Name: DATA_ROOT_PATH
              Value: ./data
            - Name: PAGE_SIZE
              Value: "20"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "wget -q --spider http://localhost:${ContainerPort}/api/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10

  # ════════════════════════════════════════════════
  #  ECS SERVICE
  # ════════════════════════════════════════════════
  EcsService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: itpros-wordaday-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: itpros-wordaday
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup

Outputs:
  VpcId:
    Value: !Ref Vpc
  AlbDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Description: Application URL
  EcsClusterArn:
    Value: !GetAtt EcsCluster.Arn
  EcsServiceArn:
    Value: !Ref EcsService
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  LogGroupName:
    Value: !Ref LogGroup
