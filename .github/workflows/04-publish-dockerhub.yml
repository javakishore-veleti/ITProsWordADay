name: "04 - Publish to DockerHub"

on:
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/it-pros-wordaday:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/it-pros-wordaday:${{ github.sha }}

      - name: Print image info
        run: |
          echo "Pushed: ${{ secrets.DOCKERHUB_USERNAME }}/it-pros-wordaday:latest"
          echo "Pushed: ${{ secrets.DOCKERHUB_USERNAME }}/it-pros-wordaday:${{ github.sha }}"
