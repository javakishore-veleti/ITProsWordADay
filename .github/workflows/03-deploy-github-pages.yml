name: "03 - Deploy to GitHub Pages"

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Portals/EnglishWordADayPortal/package-lock.json

      - name: Install dependencies
        working-directory: Portals/EnglishWordADayPortal
        run: npm ci

      - name: Build static export
        working-directory: Portals/EnglishWordADayPortal
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/ITProsWordADay"
        run: npm run build

      - name: Add .nojekyll
        run: touch Portals/EnglishWordADayPortal/out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Portals/EnglishWordADayPortal/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
