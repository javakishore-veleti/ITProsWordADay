name: "02 - Create Docker Image"

on:
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: it-pros-wordaday:${{ github.sha }}

      - name: Verify image
        run: |
          docker image inspect it-pros-wordaday:${{ github.sha }}
          echo "Docker image built successfully"

      - name: Save Docker image as artifact
        run: |
          docker save it-pros-wordaday:${{ github.sha }} | gzip > it-pros-wordaday.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: it-pros-wordaday.tar.gz
          retention-days: 7
